<!doctype html>
<!-- Sorgente della social preview: renderizzare a 1200x630 in assets/social-preview.png
     es. firefox &#45;&#45;headless &#45;&#45;screenshot social-preview.png &#45;&#45;window-size=1200,630 <url> -->
<html lang="it">

<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    * { margin: 0; box-sizing: border-box; }

    html, body { width: 1200px; height: 630px; overflow: hidden; }

    body { display: flex; position: relative; font-family: 'Fraunces', Georgia, serif; }

    .half { flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 110px; }

    .chef {
      background:
        radial-gradient(ellipse 90% 70% at 50% -10%, rgba(196, 144, 63, 0.2), transparent 60%),
        #f6efe3;
      color: #241c12;
    }

    .dev {
      background:
        radial-gradient(ellipse 90% 70% at 50% -10%, rgba(0, 181, 133, 0.16), transparent 60%),
        #070b0a;
      color: #eef4f2;
      position: relative;
    }

    .dev::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .inner { text-align: center; position: relative; }

    .portrait {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 24px;
    }

    .chef .portrait {
      border: 4px solid rgba(165, 107, 33, 0.55);
      filter: grayscale(1) contrast(1.05);
      box-shadow: 0 20px 45px -15px rgba(60, 40, 10, 0.45);
    }

    .dev .portrait {
      border: 4px solid rgba(52, 211, 153, 0.5);
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.7);
    }

    .label-chef {
      font-style: italic;
      font-size: 30px;
      color: #a56b21;
    }

    .label-dev {
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      color: #34d399;
    }

    .amp {
      position: absolute;
      left: 50%;
      top: 205px;
      transform: translateX(-50%);
      width: 92px;
      height: 92px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-style: italic;
      font-size: 42px;
      background: linear-gradient(105deg, #f6efe3 50%, #070b0a 50%);
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 14px 50px rgba(0, 0, 0, 0.5);
      z-index: 5;
    }

    .amp span {
      background: linear-gradient(105deg, #a56b21 40%, #34d399 60%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nameplate {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 64px;
      text-align: center;
      z-index: 5;
    }

    /* La card è fissa a 1200px col taglio esattamente al centro:
       gradiente hard-coded al 50% (mix-blend-mode non è affidabile in headless) */
    .nameplate .full {
      font-size: 58px;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: linear-gradient(90deg, #241c12 0 50%, #eef4f2 50% 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nameplate .sub {
      display: block;
      margin-top: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 19px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #6d5c44 0 50%, #9db3ad 50% 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>
</head>

<body>
  <div class="half chef">
    <div class="inner">
      <img class="portrait" src="giovanni-chef.webp" alt="" />
      <div class="label-chef">Lo Chef</div>
    </div>
  </div>

  <div class="half dev">
    <div class="inner">
      <img class="portrait" src="giovanni-dev.webp" alt="" />
      <div class="label-dev">Il Dev</div>
    </div>
  </div>

  <div class="amp"><span>&amp;</span></div>

  <div class="nameplate">
    <span class="full">Giovanni La Cascia</span>
    <span class="sub">chef di professione · dev per passione</span>
  </div>
</body>

</html>
